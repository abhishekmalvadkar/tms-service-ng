<div class="task-list">

  <!-- Filters Section -->
  <div class="row mb-3">
    <div class="col-12 col-md-4 mb-2">
      <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
    </div>
    <div class="col-12 col-md-4 mb-2">
      <select class="form-select" [(ngModel)]="selectedStatus">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
      </select>
    </div>
    <div class="col-12 col-md-4 mb-2">
      <div class="calendar-container">

    <p-calendar
    placeholder="Select due date..."
    [(ngModel)]="dueDateFilter"
    [iconDisplay]="'input'"
    [showIcon]="true"
    inputId="icondisplay" />

      </div>
    </div>
    <div class="col-12 col-md-2 mb-2">
      <button class="create-task">New</button>
    </div>
  </div>
  <!-- Task Cards -->
  <div *ngFor="let task of tasks" class="task-card">
    <p-card>
      <ng-template pTemplate="header">
        <h3>{{ task.title }}</h3>
      </ng-template>
      <div>
        <p>{{ task.summary | slice:0:20 }}...</p>
        <p [ngStyle]="{ color: task.status === 'Pending' ? 'red' : 'green' }">
          Status: {{ task.status }}
        </p>
        <p [ngStyle]="{ color: 'red' }">
          Due Date: {{ task.dueDate | date:'shortDate' }}
        </p>
      </div>

     <!-- Ellipsis Menu -->
     <div class="ellipsis" (click)="toggleActions(task, $event)">
      &#8230;
    </div>

      <!-- Actions Section -->
      <div *ngIf="task.showActions" class="actions">
        <div *ngIf="task.status != 'Completed'" class="action-item">
          <button (click)="markAsCompleted(task)">Mark as Completed</button>
        </div>
        <div class="action-item">
          <button (click)="viewTask(task)">View</button>
        </div>
        <div class="action-item">
          <button (click)="removeTask(task)" style="color: red;">Remove</button>
        </div>
      </div>

    </p-card>
  </div>
</div>
