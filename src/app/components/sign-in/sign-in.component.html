<div class="card-container">
  <p-card class="sign-in-card" header="Sign in to TMS">
    <form (submit)="onSignIn()">

      <div class="form-input-gap">
        <p-floatLabel>
          <input id="email" name="email" type="email" pInputText [(ngModel)]="model.email" required
            class="form-control" />
          <label for="email">Email address</label>
        </p-floatLabel>
      </div>

      <div class="form-input-gap">
        <p-floatLabel>
          <input id="password" name="password" type="password" pInputText [(ngModel)]="model.password"
            class="form-control" required />
          <label for="password">Password</label>
        </p-floatLabel>
      </div>

      <div class="button-group form-input-gap">
        <button type="submit" pButton class="tms-btn-primary" label="Sign In"></button>
      </div>
    </form>
    <div class="text-center">
      <h6>Don't have an account? <a [routerLink]="['/create-account']" routerLinkActive="router-link-active"  class="text-decoration-none">Sign up</a></h6>
    </div>
  </p-card>

</div>
