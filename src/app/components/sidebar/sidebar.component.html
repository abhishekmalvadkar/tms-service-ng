<div class="sidebar" [ngClass]="{ 'open': isOpen }" (click)="closeSidebar()">
  <div class="user-info" (click)="$event.stopPropagation()">
    <h5>{{ username }} ({{ role }})</h5>
    <p>Last logged in: {{ lastLoggedIn | date: 'short' }}</p>
  </div>
  <hr>
  <ul class="menu">
    <li [routerLink]="['/home']" >My Tasks</li>
    <li [routerLink]="['/home/my-report']">My Report</li>
    <li (click)="onLogout()">Logout</li>
  </ul>
</div>
